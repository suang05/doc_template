# Redocly lint configuration for specs/openapi.json (generated from code by `dotnet build`).
# Run:  npx @redocly/cli lint specs/openapi.json   (file must be named redocly.yaml - v2 ignores .redocly.yaml)
# Severity policy: `error` blocks the gate, `warn` is tracked tech debt, `off` is not applicable to this service.
extends:
  - recommended

rules:
  # --- Identity & completeness (blocking) ---------------------------------
  operation-operationId: error
  operation-operationId-unique: error
  operation-operationId-url-safe: error
  operation-summary: error
  operation-2xx-response: error
  operation-4xx-response: error
  no-empty-servers: error
  security-defined: error
  path-parameters-defined: error
  no-unresolved-refs: error

  # --- Error contract: every 4xx must be RFC 9457 problem+json (blocking) --
  operation-4xx-problem-details-rfc7807: error

  # --- Tracked debt --------------------------------------------------------
  no-unused-components: warn
  no-ambiguous-paths: warn   # MVC route constraints (e.g. {id:guid}) are not expressible in OAS
  # Known contract issue: POST /templates/{slug}/validate and /templates/{id}/validate differ only by
  # parameter name. Valid in MVC (guid constraint) but ambiguous in OAS. Decide whether to drop the
  # {slug}/validate alias (breaking) - then promote this rule back to error.
  no-identical-paths: warn

  # --- Not applicable: internal service, contact/license live in the repo ---
  info-license: off
  info-contact: off
  tag-description: off
  operation-description: off

